name: Passive Runtime checks

on:
  push:
    branches: [main]
    paths: ['runtime/**', 'native/**', 'shared/**', 'input/**', 'screen/**', 'chrome/**', 'android/**', 'mcp/**', 'package.json', 'bun.lock', 'tsconfig.json', '.github/workflows/passive-runtime-checks.yml']
  pull_request:
    paths: ['runtime/**', 'native/**', 'shared/**', 'input/**', 'screen/**', 'chrome/**', 'android/**', 'mcp/**', 'package.json', 'bun.lock', 'tsconfig.json', '.github/workflows/passive-runtime-checks.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: passive-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive exact source snapshot
        run: git archive --format=tar.gz HEAD > "$RUNNER_TEMP/source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}
          path: ${{ runner.temp }}/source.tar.gz
          retention-days: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Runtime regression suite
        run: bun test runtime/tests
      - name: Native protocol and command-loop fixtures
        run: bun test native/tests
      - name: MCP catalog and proxy regression tests
        run: bun test mcp/tests/catalog-server.test.ts mcp/tests/chat-proxy.test.ts mcp/tests/runtime-mcp.test.ts
      - name: Runtime and Native TypeScript
        run: |
          bun run --cwd runtime typecheck
          bun x tsc --noEmit -p native/tsconfig.json
      - name: Native C and observer fixtures (no live input)
        run: sh native/scripts/check.sh
