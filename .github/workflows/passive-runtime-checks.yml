name: Passive Runtime checks

on:
  push:
    branches: [main]
    paths:
      - 'runtime/**'
      - 'native/**'
      - 'shared/**'
      - 'input/**'
      - 'screen/**'
      - 'mcp/**'
      - 'bun.lock'
      - '.github/workflows/passive-runtime-checks.yml'
  pull_request:
    paths:
      - 'runtime/**'
      - 'native/**'
      - 'shared/**'
      - 'input/**'
      - 'screen/**'
      - 'mcp/**'
      - 'bun.lock'
      - '.github/workflows/passive-runtime-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: passive-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Observer and Runtime regression tests
        run: >-
          bun test
          runtime/tests/observer-hub.test.ts
          runtime/tests/agent-view-guard.test.ts
          runtime/tests/host.test.ts
          runtime/tests/heartbeat.test.ts
          runtime/tests/transport.test.ts
          runtime/tests/method-registry.test.ts
      - name: Runtime TypeScript
        run: bun run --cwd runtime typecheck
      - name: Native observer fixtures (no live input)
        run: sh native/scripts/check-observer.sh
