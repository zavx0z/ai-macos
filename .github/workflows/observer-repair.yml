name: Validate observer repair
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/observer-repair.yml']
permissions:
  contents: write
concurrency:
  group: observer-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Reconstruct reviewed patch and verify integrity
        env:
          PATCH_PART_1: >-
            
          PATCH_PART_2: >-
            
          PATCH_PART_3: >-
            
        run: |
          python3 - <<'PY'
          import os, base64, gzip, hashlib, pathlib
          encoded = ''.join(os.environ['PATCH_PART_' + str(i)].strip() for i in (1, 2, 3))
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '3e3f6fba1fba54e9f7af63913597387f5158fffce045da699b1d08eaad0d620e'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'observer.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/observer.patch"
          git apply "$RUNNER_TEMP/observer.patch"
      - run: bun install --frozen-lockfile
      - name: Runtime regression suite
        run: bun test runtime/tests
      - name: Native protocol and command-loop fixtures
        run: bun test native/tests
      - name: TypeScript
        run: |
          bun run --cwd runtime typecheck
          bun x tsc --noEmit -p native/tsconfig.json
      - name: Native observer and C fixtures
        run: |
          sh native/scripts/check-observer.sh
          sh native/scripts/check.sh
          git diff --check
      - name: Remove temporary transport and retain ordinary regression CI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/passive-runtime-checks.yml')
          s = p.read_text().split('  test-runtime:')[0]
          start = s.index('      - name: Archive tested source')
          end = s.index('      - uses: oven-sh/setup-bun@v2', start)
          s = s[:start] + s[end:]
          s += '      - name: Native command-loop fixtures\n        run: bun test native/tests\n'
          p.write_text(s)
          Path('.github/workflows/observer-repair.yml').unlink()
          PY
      - name: Publish only after all checks passed (never force-push)
        run: |
          git diff --check
          git add runtime/src runtime/tests native/src native/tests docs/architecture/observer-failure-recovery.md .github/workflows
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git commit -m 'fix: isolate observer failures and recover continuous observation without restarting Native'
          git push origin HEAD:main
          git rev-parse HEAD
