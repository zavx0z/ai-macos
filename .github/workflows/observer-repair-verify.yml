name: Verify observer recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/observer-repair-verify.yml']
permissions:
  contents: write
concurrency:
  group: observer-repair
  cancel-in-progress: false
jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Apply reviewed patch with integrity verification
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, os, re
          from pathlib import Path
          workflow = Path('.github/workflows/observer-repair.yml').read_text()
          encoded = ''.join(re.findall(r'PATCH_PART_\d: >-\n\s+(\S+)', workflow))
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '3e3f6fba1fba54e9f7af63913597387f5158fffce045da699b1d08eaad0d620e'
          Path(os.environ['RUNNER_TEMP'], 'observer.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/observer.patch"
          git apply "$RUNNER_TEMP/observer.patch"
      - name: Apply reviewed fixture corrections and gap diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              assert text.count(old) == 1, (path, old)
              p.write_text(text.replace(old, new))
          replace('runtime/tests/host-identity.test.ts',
              '  transport.fullView = true\n  transport.viewVersion = "1"\n  transport.grantStartupPermissions()\n  if (!gap)',
              '  transport.fullView = true\n  transport.viewVersion = "1"\n  transport.readinessState = "ready"\n  transport.grantStartupPermissions()\n  if (!gap)')
          replace('runtime/tests/host-identity.test.ts',
              '    if (gap) {\n      expect(host.doctor().observer.viewReady).toBe(true)',
              '    if (gap) {\n      expect(host.catalog.descriptors().tools.some(tool => tool.name === "click")).toBe(true)\n      expect(host.doctor().observer.viewReady).toBe(true)')
          replace('runtime/src/agent-view-guard.ts',
              '      this.#invalidateAll(reason)\n      throw new Error(reason)',
              '      this.#invalidateAll(reason.slice(0, 1024))\n      throw new Error(reason)')
          p = Path('runtime/tests/agent-view-guard.test.ts')
          p.write_text(p.read_text() + '''

          test("длинная причина coverage не маскируется ошибкой лимита при invalidation", async () => {
            const value = fixture()
            const scope = value.guard.forLineage("lineage:long-reason")
            const ticket = await observe(value, "lineage:long-reason", "target:long-reason", target)
            const original = value.observer.coverage.bind(value.observer)
            value.observer.coverage = async () => ({ ...await original(), state: "unavailable", reason: "x".repeat(1024) })
            try {
              await expect(scope.admit(ticket, "operation:long-reason")).rejects.toThrow("state=unavailable")
              value.observer.coverage = original
              await expect(scope.admit(ticket, "operation:long-reason:stale")).rejects.toThrow("coverage")
            } finally { await value.guard.close() }
          })
          ''')
          replace('native/tests/command-loop.test.ts', '''    const version = await adapter.clipboard(nativeClipboardRequestSchema.parse({ kind: "clipboard", protocolVersion: "1",
                requestId: "after-gap-read", ...generation, deadlineAt, command: { method: "clipboard.version", payload: {} } }), control)''', '''    const version = await adapter.clipboard(nativeClipboardRequestSchema.parse({
                kind: "request", protocolVersion: "1", requestId: "after-gap-read", ...generation, deadlineAt,
                operation: {
                  kind: "clipboard", operationId: "after-gap-operation", clientRequestId: "after-gap-client-request",
                  clientSessionId: "client", principalId: "principal", runtimeEpoch: generation.runtimeEpoch,
                  loginSessionId: generation.loginSessionId, inventoryId: "inventory", inventoryRevision: 0, deadlineAt,
                  target: { kind: "clipboard", ref: { runtimeEpoch: generation.runtimeEpoch, loginSessionId: generation.loginSessionId, clipboardRef: "system" } },
                },
                command: { method: "clipboard.version", payload: {} },
              }), control)''')
          replace('native/src/capture-command/meta_capture_command_test.m', '''    assert(strcmp([pending[@"ack"][@"quarantined"] objCType],
                            @encode(BOOL)) == 0);''', '''    // Objective-C encoding NSNumber не определяет переносимую проверку JSON boolean.
              assert(CFGetTypeID((__bridge CFTypeRef)pending[@"ack"][@"quarantined"]) ==
                     CFBooleanGetTypeID());''')
          replace('native/src/capture-command/meta_capture_command_test.m', '''    assert(strcmp([released[@"ack"][@"quarantined"] objCType],
                            @encode(BOOL)) == 0);''', '''    assert(CFGetTypeID((__bridge CFTypeRef)released[@"ack"][@"quarantined"]) ==
                     CFBooleanGetTypeID());''')
          replace('runtime/src/observer-hub.ts',
              '      gapDetected: gap || this.#coverage.gapDetected,',
              '      gapDetected: gap || this.#gap !== undefined || this.#coverage.gapDetected,')
          p = Path('runtime/tests/observer-hub.test.ts')
          p.write_text(p.read_text() + '''

          test("настоящий gap во время ожидания доставки сохраняется в текущем coverage", async () => {
            const value = fixture()
            value.hub.start()
            value.setSnapshot(watermark(3))
            const pending = value.hub.coverage()
            await Bun.sleep(0)
            value.queue.push(event(2))
            try {
              await expect(pending).resolves.toMatchObject({ state: "unavailable", gapDetected: true })
              expect(value.gaps).toHaveLength(1)
            } finally { await value.hub.close() }
          })
          ''')
          PY
      - name: Remove timing assumption from asynchronous capture fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('native/tests/capture-command-loop.test.ts')
          s = p.read_text()
          marker = 'test("production command loop проводит observer ACK перед PUSH и capture lifecycle", async () => {'
          helper = '''type CaptureResultReply = Extract<ReturnType<typeof nativeCaptureCleanupResponseSchema.parse>, { purpose: "result" }>

          // Ожидаем фактический callback fake capture, а не предполагаем завершение за 30 мс.
          // Повторяется только чтение результата; capture.start никогда не повторяется.
          async function finishCapture(
            adapter: NativeBrokerAdapter,
            captureTaskRef: string,
            initial: CaptureResultReply,
            requestPrefix: string,
            operationId = "operation-1",
          ): Promise<CaptureResultReply> {
            const signal = AbortSignal.timeout(3_000)
            let result = initial
            for (let attempt = 1; result.poll.state === "pending"; attempt++) {
              signal.throwIfAborted()
              await Bun.sleep(5)
              const next = await adapter.cleanup(nativeCaptureCleanupRequestSchema, {
                control: cleanupControl("result", result.poll.status.revision,
                  result.statusEvidence.statusEvidenceRef, `${requestPrefix}:${attempt}`, operationId),
                payload: { captureTaskRef },
              }, nativeCaptureCleanupResponseSchema, { signal, checkpoint() { signal.throwIfAborted() } })
              if (next.purpose !== "result") throw new Error("Ожидался capture result")
              result = next
            }
            return result
          }

          '''
          assert s.count(marker) == 1
          s = s.replace(marker, helper + marker)
          start = s.index('    expect(pending.poll.state).toBe("pending")')
          end = s.index('    expect(completed.purpose).toBe("result")', start)
          s = s[:start] + '''    const completed = await finishCapture(adapter, started.result.captureTaskRef,
                pending, "capture-result-complete")
          ''' + s[end:]
          start = s.index('    expect(layoutPending.poll.state).toBe("pending")')
          end = s.index('    expect(layoutCompleted.purpose).toBe("result")', start)
          s = s[:start] + '''    const layoutCompleted = await finishCapture(layoutAdapter, layoutStarted.result.captureTaskRef,
                layoutPending, "capture-layout-complete", "operation-layout-1")
          ''' + s[end:]
          p.write_text(s)
          PY
      - run: bun install --frozen-lockfile
      - name: Runtime regression suite
        id: runtime
        run: bun test runtime/tests
      - name: Native protocol and command-loop fixtures
        id: native
        if: ${{ !cancelled() && steps.runtime.outcome != 'skipped' }}
        run: bun test native/tests
      - name: TypeScript
        id: types
        if: ${{ !cancelled() && steps.runtime.outcome != 'skipped' }}
        run: |
          bun run --cwd runtime typecheck
          bun x tsc --noEmit -p native/tsconfig.json
      - name: Native observer and C fixtures
        id: fixtures
        if: ${{ !cancelled() && steps.runtime.outcome != 'skipped' }}
        run: |
          sh native/scripts/check-observer.sh
          sh native/scripts/check.sh
          git diff --check
      - name: Publish source only after all checks passed
        if: ${{ success() && steps.runtime.outcome == 'success' && steps.native.outcome == 'success' && steps.types.outcome == 'success' && steps.fixtures.outcome == 'success' }}
        run: |
          git diff --check
          git add runtime/src runtime/tests native/src native/tests docs/architecture/observer-failure-recovery.md
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git commit -m 'fix: isolate observer failures and recover continuous observation without restarting Native'
          git push origin HEAD:main
          git rev-parse HEAD
