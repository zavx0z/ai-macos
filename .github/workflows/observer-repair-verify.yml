name: Verify observer recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/observer-repair-verify.yml']
permissions:
  contents: write
concurrency:
  group: observer-repair
  cancel-in-progress: false
jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Apply reviewed patch with integrity verification
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, os, re
          from pathlib import Path
          workflow = Path('.github/workflows/observer-repair.yml').read_text()
          encoded = ''.join(re.findall(r'PATCH_PART_\d: >-\n\s+(\S+)', workflow))
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '3e3f6fba1fba54e9f7af63913597387f5158fffce045da699b1d08eaad0d620e'
          Path(os.environ['RUNNER_TEMP'], 'observer.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/observer.patch"
          git apply "$RUNNER_TEMP/observer.patch"
      - name: Complete recovery fixture and bound retained diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              assert text.count(old) == 1, (path, old)
              p.write_text(text.replace(old, new))
          replace('runtime/tests/host-identity.test.ts',
              '  transport.fullView = true\n  transport.viewVersion = "1"\n  transport.grantStartupPermissions()\n  if (!gap)',
              '  transport.fullView = true\n  transport.viewVersion = "1"\n  transport.readinessState = "ready"\n  transport.grantStartupPermissions()\n  if (!gap)')
          replace('runtime/tests/host-identity.test.ts',
              '    if (gap) {\n      expect(host.doctor().observer.viewReady).toBe(true)',
              '    if (gap) {\n      expect(host.catalog.descriptors().tools.some(tool => tool.name === "click")).toBe(true)\n      expect(host.doctor().observer.viewReady).toBe(true)')
          replace('runtime/src/agent-view-guard.ts',
              '      this.#invalidateAll(reason)\n      throw new Error(reason)',
              '      this.#invalidateAll(reason.slice(0, 1024))\n      throw new Error(reason)')
          p = Path('runtime/tests/agent-view-guard.test.ts')
          p.write_text(p.read_text() + '''

          test("длинная причина coverage не маскируется ошибкой лимита при invalidation", async () => {
            const value = fixture()
            const scope = value.guard.forLineage("lineage:long-reason")
            const ticket = await observe(value, "lineage:long-reason", "target:long-reason", target)
            const original = value.observer.coverage.bind(value.observer)
            value.observer.coverage = async () => ({ ...await original(), state: "unavailable", reason: "x".repeat(1024) })
            try {
              await expect(scope.admit(ticket, "operation:long-reason")).rejects.toThrow("state=unavailable")
              value.observer.coverage = original
              await expect(scope.admit(ticket, "operation:long-reason:stale")).rejects.toThrow("coverage")
            } finally { await value.guard.close() }
          })
          ''')
          PY
      - run: bun install --frozen-lockfile
      - name: Runtime regression suite
        id: runtime
        run: bun test runtime/tests
      - name: Native protocol and command-loop fixtures
        id: native
        if: ${{ !cancelled() && steps.runtime.outcome != 'skipped' }}
        run: bun test native/tests
      - name: TypeScript
        id: types
        if: ${{ !cancelled() && steps.runtime.outcome != 'skipped' }}
        run: |
          bun run --cwd runtime typecheck
          bun x tsc --noEmit -p native/tsconfig.json
      - name: Native observer and C fixtures
        id: fixtures
        if: ${{ !cancelled() && steps.runtime.outcome != 'skipped' }}
        run: |
          sh native/scripts/check-observer.sh
          sh native/scripts/check.sh
          git diff --check
      - name: Publish source only after all checks passed
        if: ${{ success() && steps.runtime.outcome == 'success' && steps.native.outcome == 'success' && steps.types.outcome == 'success' && steps.fixtures.outcome == 'success' }}
        run: |
          git diff --check
          git add runtime/src runtime/tests native/src native/tests docs/architecture/observer-failure-recovery.md
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git commit -m 'fix: isolate observer failures and recover continuous observation without restarting Native'
          git push origin HEAD:main
          git rev-parse HEAD
