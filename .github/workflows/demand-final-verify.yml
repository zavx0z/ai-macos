name: Verify demand lifecycle final
on:
  push:
    branches: [main]
    paths: ['.github/workflows/demand-final-verify.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: demand-verify
  cancel-in-progress: false
jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Apply reviewed patches with integrity verification
        env:
          FOLLOWUP: >-
            
        run: |
          python3 - <<'PY'
          import os, re, base64, lzma, gzip, hashlib
          from pathlib import Path
          workflow = Path('.github/workflows/demand-verify.yml').read_text()
          encoded = ''.join(re.findall(r'PATCH_\d: >-\n\s+(\S+)', workflow))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '4683fb788393f9c26ae515b6202b29daec23573708ef1401f6ed1c0da114c4ba'
          followup = gzip.decompress(base64.b64decode(os.environ['FOLLOWUP'].strip(), validate=True))
          assert hashlib.sha256(followup).hexdigest() == 'c45bcaf7ee5076e5fca9e56957ba8fcf2fe53e6c2b0bfdba0da0fba5735e7217'
          Path(os.environ['RUNNER_TEMP'], 'demand.patch').write_bytes(patch)
          Path(os.environ['RUNNER_TEMP'], 'followup.patch').write_bytes(followup)
          PY
          git apply --check "$RUNNER_TEMP/demand.patch"
          git apply "$RUNNER_TEMP/demand.patch"
          git apply --check "$RUNNER_TEMP/followup.patch"
          git apply "$RUNNER_TEMP/followup.patch"
      - run: bun install --frozen-lockfile
        id: install
      - name: Runtime tests
        id: runtime
        run: bun test runtime/tests
      - name: Native tests
        id: native
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun test native/tests
      - name: Screen and input tests
        id: adapters
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun test screen/tests input/tests
      - name: MCP regression
        id: mcp
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun test mcp/tests/catalog-server.test.ts mcp/tests/chat-proxy.test.ts mcp/tests/runtime-mcp.test.ts
      - name: TypeScript
        id: types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          bun run --cwd runtime typecheck
          bun x tsc --noEmit -p native/tsconfig.json
          bun x tsc --noEmit -p screen/tsconfig.json
          bun x tsc --noEmit -p input/tsconfig.json
      - name: Native fixtures
        id: fixtures
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: sh native/scripts/check.sh
      - name: Publish only tested source, without deployment
        if: ${{ success() && steps.runtime.outcome == 'success' && steps.native.outcome == 'success' && steps.adapters.outcome == 'success' && steps.mcp.outcome == 'success' && steps.types.outcome == 'success' && steps.fixtures.outcome == 'success' }}
        run: |
          git diff --check
          git add runtime native screen input mcp docs
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git commit -m 'refactor: make runtime observation and waiting demand-driven'
          git push origin HEAD:main
          git rev-parse HEAD
