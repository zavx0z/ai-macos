name: Review demand-driven Computer Use
on:
  push:
    branches: [main]
    paths: ['.github/workflows/demand-review.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: demand-completion
  cancel-in-progress: false
jobs:
  review:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Restore and verify reviewed source
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, lzma, re, subprocess
          from pathlib import Path
          for file, pattern, decompress, digest in [
              ('demand-verify.yml', r'PATCH_\d: >-\n\s+(\S+)', lzma.decompress, '4683fb788393f9c26ae515b6202b29daec23573708ef1401f6ed1c0da114c4ba'),
              ('demand-final-verify.yml', r'FOLLOWUP: >-\n\s+(\S+)', gzip.decompress, 'c45bcaf7ee5076e5fca9e56957ba8fcf2fe53e6c2b0bfdba0da0fba5735e7217'),
          ]:
              text = Path('.github/workflows', file).read_text()
              patch = decompress(base64.b64decode(''.join(re.findall(pattern, text)), validate=True))
              assert hashlib.sha256(patch).hexdigest() == digest
              subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
              subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          p = Path('runtime/tests/agent-operations.test.ts')
          text = p.read_text()
          marker = '  test("real RuntimeCore остаётся authority при cancel pending handler", async () => {'
          assert text.count(marker) == 1
          before, case = text.split(marker)
          case = '\n    const clock = { now: () => new Date("2026-09-15T10:00:00.000Z") }' + case
          case = case.replace('    const runtime = new RuntimeCore({\n', '    const runtime = new RuntimeCore({\n      clock,\n', 1)
          case = case.replace('    const operations = new AgentOperations({\n', '    const operations = new AgentOperations({\n      clock,\n', 1)
          assert case.count('new Date(Date.now() + 30_000)') == 1
          case = case.replace('new Date(Date.now() + 30_000)', 'new Date(clock.now().getTime() + 30_000)')
          extra = '''  test("обёртка tracked action сохраняет общий deadline и caller cancellation", async () => {
              const { runtime, first, operations, firstScope } = fixture()
              const caller = new AbortController()
              const deadlineAt = Date.parse("2026-09-15T10:00:30.000Z")
              bindDeadline(caller.signal, deadlineAt)
              const cancelled = new Error("caller остановил action")
              await expect(operations.runTrackedMutation(first, "target:window", "press-key", async context => {
                expect(context.signal).not.toBe(caller.signal)
                expect(signalDeadline(context.signal)).toBe(deadlineAt)
                caller.abort(cancelled)
                expect(context.signal.aborted).toBe(true)
                runtime.records.set(context.clientRequestId, operation(first, context.clientRequestId,
                  "operation:deadline", "cancelled"))
                context.signal.throwIfAborted()
              }, caller.signal)).rejects.toThrow(cancelled.message)
              expect(firstScope.retained.size).toBe(0)
            })

          '''
          p.write_text('import { bindDeadline, signalDeadline } from "../src/deadline.ts"\n' + before + extra + marker + case)
          p = Path('runtime/src/agent-operations.ts')
          text = 'import { bindDeadline, signalDeadline } from "./deadline.ts"\n' + p.read_text()
          old = '    const controller = new AbortController()\n    const record: TrackedRecord = {'
          new = '    const controller = new AbortController()\n    const deadlineAt = signalDeadline(signal)\n    if (deadlineAt !== undefined) bindDeadline(controller.signal, deadlineAt)\n    const record: TrackedRecord = {'
          assert text.count(old) == 1
          p.write_text(text.replace(old, new))
          p = Path('docs/architecture/runtime-demand-lifecycle.md')
          text = p.read_text()
          old = 'начинают новый полный budget. Core ограничивает intent этим deadline;'
          assert text.count(old) == 1
          p.write_text(text.replace(old, 'начинают новый полный budget. Обёртка tracked action сохраняет deadline при создании\nдочернего сигнала отмены. Core ограничивает intent этим deadline;'))
          subprocess.run(['git', 'add', 'runtime', 'native', 'screen', 'input', 'mcp', 'docs'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          manifest = '\n'.join(f'{p}:{hashlib.sha256(Path(p).read_bytes()).hexdigest()}' for p in sorted(paths))
          digest = hashlib.sha256(manifest.encode()).hexdigest()
          assert digest == 'dcd46400c6cd4233519cfd8f3708f4911a59c61f7ef1138f03e7f52535ca401c', digest
          print('Reviewed source verified:', len(paths), 'files', digest)
          PY
      - run: bun install --frozen-lockfile
        id: install
      - name: Runtime tests
        id: runtime
        run: bun test runtime/tests
      - name: Native tests
        id: native
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun test native/tests
      - name: Screen and Input tests
        id: adapters
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun test screen/tests input/tests
      - name: MCP tests
        id: mcp
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun test mcp/tests/catalog-server.test.ts mcp/tests/chat-proxy.test.ts mcp/tests/runtime-mcp.test.ts
      - name: TypeScript
        id: types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          bun run --cwd runtime typecheck
          bun x tsc --noEmit -p native/tsconfig.json
          bun x tsc --noEmit -p screen/tsconfig.json
          bun x tsc --noEmit -p input/tsconfig.json
      - name: Native fixtures
        id: fixtures
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: sh native/scripts/check.sh
      - name: Publish tested source without deployment
        if: ${{ success() && steps.runtime.outcome == 'success' && steps.native.outcome == 'success' && steps.adapters.outcome == 'success' && steps.mcp.outcome == 'success' && steps.types.outcome == 'success' && steps.fixtures.outcome == 'success' }}
        run: |
          git diff --check
          git diff --cached --check
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git commit -m 'refactor: make Computer Use observation event-driven and share action deadlines'
          git push origin HEAD:main
          git rev-parse HEAD
